# Suites CircleCI Smarter Testing (circleci testsuite run "<nom>").
# Un fichier de test = un atome ; résultats JUnit téléversés automatiquement.
# La couverture globale (cliquet) est mesurée à part, sur des exécutions complètes :
# voir le job « coverage » et scripts/test-coverage.mjs.
---
name: unit-client
discover: pnpm exec vitest list --filesOnly --config vitest.config.ts
run: pnpm exec vitest run --config vitest.config.ts --reporter=default --reporter=junit --outputFile.junit="<< outputs.junit >>" << test.atoms >>
options:
  store-test-results: true
---
name: unit-server
discover: pnpm exec vitest list --filesOnly --config vitest.server.config.ts
run: pnpm exec vitest run --config vitest.server.config.ts --reporter=default --reporter=junit --outputFile.junit="<< outputs.junit >>" << test.atoms >>
options:
  store-test-results: true
---
name: integration
discover: pnpm exec vitest list --filesOnly --config vitest.integration.config.ts
run: pnpm exec vitest run --config vitest.integration.config.ts --reporter=default --reporter=junit --outputFile.junit="<< outputs.junit >>" << test.atoms >>
options:
  store-test-results: true
