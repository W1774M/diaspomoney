version: 2.1

# =====================================================================================
# CI/CD DiaspoMoney
#
#   toutes branches sauf rct et main : installation → tests (lint, types, tests + couverture) → build → E2E
#   dev             : … → déploiement dev → ouverture de la PR dev → rct
#   rct             : contrôle « rct = commit dev testé » → déploiement rct → ouverture de la PR rct → main
#                       → [Approve dans CircleCI] → fusion de la PR rct → main
#   main            : contrôle « main = commit rct testé » → déploiement prod → validation Sentry
#
# Variables du projet CircleCI (Project Settings → Environment Variables) :
#   DEPLOY_HOST, DEPLOY_USER                      accès SSH au serveur (clé d'hôte inscrite dans ce fichier)
#   GITHUB_TOKEN                                  jeton GitHub (pull requests en écriture)
# Clé SSH (Project Settings → SSH Keys → Additional SSH Keys) : clé « circleci-deploy »,
# limitée côté serveur à scripts/server/ci-deploy.sh (déploiement uniquement).
#
# Notes :
# - Ne pas redéfinir PATH dans `environment:` : CircleCI n'y développe ni `~` ni `$PATH`.
# - Next 16 exige Node >= 20.9 : image cimg/node:20.19 (Node 20, comme le Dockerfile).
# - pnpm-lock.yaml est versionné : la CI installe exactement les versions de la prod.
# =====================================================================================

executors:
  node:
    docker:
      - image: cimg/node:20.19
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

  # Node + MongoDB de test sur le port attendu par tests/setup.mongo.ts (127.0.0.1:27018).
  node-mongo:
    docker:
      - image: cimg/node:20.19-browsers
      - image: mongo:7
        command: ["mongod", "--port", "27018", "--bind_ip_all"]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      MONGODB_URI: mongodb://127.0.0.1:27018/diaspomoney_test

  base:
    docker:
      - image: cimg/base:current

commands:
  attach-deps:
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: 📦 Versions
          command: node --version && pnpm --version

  wait-for-mongo:
    steps:
      - run:
          name: ⏳ Attente de MongoDB
          command: |
            for i in $(seq 1 30); do
              node -e "require('net').connect(27018,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" && exit 0
              sleep 2
            done
            echo "❌ MongoDB n'a pas démarré" && exit 1

jobs:
  # ---------------------------------------------------------------------------
  install-dependencies:
    executor: node
    steps:
      - checkout
      - run:
          name: 📦 pnpm
          command: pnpm --version && pnpm config set store-dir ~/.pnpm-store
      - restore_cache:
          keys:
            - v2-pnpm-{{ checksum "pnpm-lock.yaml" }}
            - v2-pnpm-
      - run:
          name: 📚 Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: v2-pnpm-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  # ---------------------------------------------------------------------------
  # Lint, types, puis une seule exécution des trois suites (client, serveur, intégration)
  # avec couverture : rapports fusionnés, échec sous les seuils de coverage-thresholds.json
  # (cliquet), résultats JUnit téléversés (onglet Tests, Test Insights).
  tests:
    executor: node-mongo
    steps:
      - attach-deps
      - run:
          name: 🔍 Lint
          command: pnpm lint
      - run:
          name: 📝 TypeScript Check
          command: pnpm tsc:check
      - wait-for-mongo
      - run:
          name: 🧪 Tests + 📊 couverture globale (cliquet)
          command: pnpm test:coverage
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage
          destination: coverage

  # ---------------------------------------------------------------------------
  build:
    executor: node
    environment:
      NODE_ENV: production
      APP_URL: https://dev.diaspomoney.fr
      API_URL: https://dev.diaspomoney.fr/api
      NEXTAUTH_URL: https://dev.diaspomoney.fr
      NEXT_PUBLIC_APP_URL: https://dev.diaspomoney.fr
      NEXT_PUBLIC_API_URL: https://dev.diaspomoney.fr/api
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
    steps:
      - attach-deps
      - run:
          name: 🏗️ Build application
          command: pnpm build && rm -rf .next/cache
      - persist_to_workspace:
          root: .
          paths:
            - .next
            - public/styles.css

  # ---------------------------------------------------------------------------
  # E2E Playwright (Chromium) sur le build de production, avec une base MongoDB vide.
  e2e:
    executor: node-mongo
    environment:
      NODE_ENV: production
      AUTH_SECRET: e2e-ci-secret-not-used-anywhere-else
      NEXTAUTH_SECRET: e2e-ci-secret-not-used-anywhere-else
      NEXTAUTH_URL: http://localhost:3000
      PORT: "3000"
    steps:
      - attach-deps
      - wait-for-mongo
      # Navigateur mis en cache par version du lockfile (évite ~150 Mo de téléchargement).
      - restore_cache:
          keys:
            - v1-playwright-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: 🎭 Navigateur Chromium
          command: pnpm exec playwright install --with-deps chromium
      - save_cache:
          key: v1-playwright-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.cache/ms-playwright
      - run:
          name: 🎭 Tests E2E
          command: pnpm test:e2e
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: playwright-report
          destination: playwright-report

  # ---------------------------------------------------------------------------
  # Déploiement + marqueurs CircleCI Deploys (plan → déploiement → RUNNING → SUCCESS/FAILED).
  # Plan « deploy-<env> », composant « diaspomoney », version = SHA git complet (c'est ce que
  # le pipeline de rollback redéploie). Quand la validation est active (production), le job
  # ne marque pas SUCCESS : c'est le job « type: release » qui le fait après la fenêtre
  # d'observation.
  deploy:
    executor: base
    parameters:
      env:
        type: enum
        enum: [dev, rct, prod]
      environment-name:
        type: enum
        enum: [development, staging, production]
      validated:
        type: boolean
        default: false
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:IEBaaimc2F7J9Mr2G0P15yQFZ0p88DKWQcOZa2oujxY"
      - run:
          name: Plan deployment
          command: |
            circleci run release plan deploy-<< parameters.env >> \
              --environment-name="<< parameters.environment-name >>" \
              --component-name="diaspomoney" \
              --target-version="${CIRCLE_SHA1}"
      - run:
          name: 🚀 Déploiement << parameters.env >>
          command: |
            : "${DEPLOY_HOST:?DEPLOY_HOST manquant}" "${DEPLOY_USER:?DEPLOY_USER manquant}"
            # Clé publique d'hôte du serveur (non secrète) : protège contre une usurpation du serveur.
            mkdir -p ~/.ssh && echo "${DEPLOY_HOST} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJQnLPGAhyIDjB0rYkbNl4gSVShP2iH4KE7kolx2Iv24" >> ~/.ssh/known_hosts
            ssh -o BatchMode=yes -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" "deploy << parameters.env >> $CIRCLE_SHA1"
          no_output_timeout: 30m
      - run:
          name: Update deployment status to running
          command: circleci run release update deploy-<< parameters.env >> --status=RUNNING
      - unless:
          condition: << parameters.validated >>
          steps:
            - run:
                name: Update deployment status to success
                command: circleci run release update deploy-<< parameters.env >> --status=SUCCESS
                when: on_success
      - run:
          name: Update deployment status to failed
          command: circleci run release update deploy-<< parameters.env >> --status=FAILED
          when: on_fail

  # Validation de la mise en production : CircleCI écoute les alertes du webhook
  # « sentry-errors » pendant 20 min ; une alerte qui tombe fait échouer la release et
  # déclenche le pipeline de rollback (.circleci/rollback.yml) vers la version précédente.
  release-production:
    type: release
    plan_name: deploy-prod
    validation:
      enabled: true
      auto_rollback_on_failure: true
      webhooks:
        - name: sentry-errors
          provider: custom
          # Envoyé par le relais docker/sentry-relay : status "firing" | "resolved".
          fail_when: criteria == "firing"

  # ---------------------------------------------------------------------------
  # Garde-fou des promotions, qui remplace les tests sur rct et sur main : le commit à
  # déployer doit être une fusion dont le code est identique à son second parent, et ce
  # parent doit appartenir à la branche source (dev pour rct, rct pour main). Ce parent est
  # la tête de la PR fusionnée, dont tests, build et e2e sont des contrôles obligatoires
  # (protection GitHub) : le code déployé est donc exactement du code déjà testé.
  # Toute autre arrivée de code (squash, commit direct, conflit résolu à la main) bloque.
  verifier-promotion:
    executor: base
    parameters:
      source:
        type: enum
        enum: [dev, rct]
    steps:
      - checkout
      - run:
          name: 🔒 code = commit << parameters.source >> déjà testé
          command: |
            src=<< parameters.source >>
            git fetch --quiet $([ -f "$(git rev-parse --git-dir)/shallow" ] && echo --unshallow) origin "+refs/heads/$src:refs/remotes/origin/$src"
            parent=$(git rev-parse --verify --quiet HEAD^2) || { echo "❌ $CIRCLE_SHA1 n'est pas une fusion $src → $CIRCLE_BRANCH"; exit 1; }
            git merge-base --is-ancestor "$parent" "origin/$src" || { echo "❌ $parent n'appartient pas à $src"; exit 1; }
            [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$parent^{tree}")" ] || { echo "❌ le code de $CIRCLE_BRANCH diffère du commit $src $parent"; git diff --stat "$parent" HEAD; exit 1; }
            echo "✅ $CIRCLE_BRANCH = $src $parent : déploiement sans nouveaux tests"

  # ---------------------------------------------------------------------------
  open-pr:
    executor: node
    parameters:
      head: { type: string }
      base: { type: string }
    steps:
      - checkout
      - run:
          name: 🔀 PR << parameters.head >> → << parameters.base >>
          command: bash scripts/ci/github-pr.sh open << parameters.head >> << parameters.base >>

  merge-pr:
    executor: node
    parameters:
      head: { type: string }
      base: { type: string }
    steps:
      - checkout
      - run:
          name: ✅ Fusion << parameters.head >> → << parameters.base >>
          command: bash scripts/ci/github-pr.sh merge << parameters.head >> << parameters.base >> "$CIRCLE_SHA1"

# =====================================================================================
workflows:
  ci-cd:
    jobs:
      # Contrôles qualité sur toutes les branches sauf rct et main : leur code est toujours
      # un commit dev (pour rct) ou rct (pour main) déjà testé (voir « verifier-promotion »).
      - install-dependencies:
          filters: &hors-promotions { branches: { ignore: [rct, main, /promotion\/.*/] } }
      - tests:
          requires: [install-dependencies]
          filters: *hors-promotions
      - build:
          requires: [install-dependencies]
          filters: *hors-promotions
      - e2e:
          requires: [build]
          filters: *hors-promotions

      # ---- dev : déploiement puis PR vers rct -----------------------------------
      - deploy:
          name: deploy-dev
          env: dev
          environment-name: development
          requires: [tests, e2e]
          filters: { branches: { only: dev } }
      - open-pr:
          name: pr-dev-vers-rct
          head: dev
          base: rct
          requires: [deploy-dev]
          filters: { branches: { only: dev } }

      # ---- rct : déploiement, PR vers main, validation, fusion ------------------
      - verifier-promotion:
          name: promotion-depuis-dev
          source: dev
          filters: { branches: { only: rct } }
      - deploy:
          name: deploy-rct
          env: rct
          environment-name: staging
          requires: [promotion-depuis-dev]
          filters: { branches: { only: rct } }
      - open-pr:
          name: pr-rct-vers-main
          head: rct
          base: main
          requires: [deploy-rct]
          filters: { branches: { only: rct } }
      - valider-mise-en-prod:
          type: approval
          requires: [pr-rct-vers-main]
          filters: { branches: { only: rct } }
      - merge-pr:
          name: fusion-rct-vers-main
          head: rct
          base: main
          requires: [valider-mise-en-prod]
          filters: { branches: { only: rct } }

      # ---- main : pas de nouveaux tests, contrôle de promotion puis prod ---------
      - verifier-promotion:
          name: promotion-depuis-rct
          source: rct
          filters: { branches: { only: main } }
      - deploy:
          name: deploy-prod
          env: prod
          environment-name: production
          validated: true
          requires: [promotion-depuis-rct]
          filters: { branches: { only: main } }
      - release-production:
          requires: [deploy-prod]
          filters: { branches: { only: main } }
