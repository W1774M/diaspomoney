version: 2.1

# CI DiaspoMoney : installation, lint, types, tests (unitaires, serveur, intégration),
# couverture et build. Le déploiement runtime est géré sur le serveur via Docker Compose.
#
# Notes :
# - Ne pas redéfinir PATH dans `environment:` : CircleCI n'y développe ni `~` ni `$PATH`,
#   ce qui vidait le PATH (« ssh: not found » dès le checkout).
# - Next 16 exige Node >= 20.9 : image cimg/node:20.19 (Node 20, comme le Dockerfile).
# - pnpm est préinstallé dans l'image ; pnpm 10 bascule seul sur la version
#   déclarée dans package.json (packageManager).
# - pnpm-lock.yaml est versionné : la CI installe exactement les versions de la prod.
# - Les tests E2E Playwright ne tournent pas ici (ils demandent l'app lancée,
#   des comptes de test en base et des secrets NextAuth) : `pnpm test:e2e` en local.

executors:
  node:
    docker:
      - image: cimg/node:20.19
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

  # Node + MongoDB de test sur le port attendu par tests/setup.mongo.ts (127.0.0.1:27018).
  node-mongo:
    docker:
      - image: cimg/node:20.19
      - image: mongo:7
        command: ["mongod", "--port", "27018", "--bind_ip_all"]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      MONGODB_URI: mongodb://127.0.0.1:27018/diaspomoney_test

commands:
  attach-deps:
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: 📦 Versions
          command: node --version && pnpm --version

jobs:
  # ============================================
  # INSTALLATION DES DÉPENDANCES
  # ============================================
  install-dependencies:
    executor: node
    steps:
      - checkout
      - run:
          name: 📦 pnpm
          command: |
            pnpm --version
            pnpm config set store-dir ~/.pnpm-store
      - restore_cache:
          keys:
            - v2-pnpm-{{ checksum "pnpm-lock.yaml" }}
            - v2-pnpm-
      - run:
          name: 📚 Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: v2-pnpm-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  # ============================================
  # LINT, TYPES ET TESTS
  # ============================================
  tests:
    executor: node-mongo
    steps:
      - attach-deps
      - run:
          name: 🔍 Lint
          command: pnpm lint
      - run:
          name: 📝 TypeScript Check
          command: pnpm tsc:check
      - run:
          name: 🧪 Unit Tests (Client)
          command: pnpm test:unit:client
      - run:
          name: ⏳ Attente de MongoDB
          command: |
            for i in $(seq 1 30); do
              node -e "require('net').connect(27018,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" && exit 0
              sleep 2
            done
            echo "❌ MongoDB n'a pas démarré" && exit 1
      - run:
          name: 🧪 Unit Tests (Server)
          command: pnpm test:unit:server
      - run:
          name: 🔗 Integration Tests
          command: pnpm test:integration
          environment:
            NODE_ENV: test

  # ============================================
  # COUVERTURE DE CODE (tests unitaires client)
  # ============================================
  coverage:
    executor: node
    steps:
      - attach-deps
      - run:
          name: 📊 Couverture (seuil 90 % des lignes)
          # Le seuil fait échouer la commande s'il n'est pas atteint.
          command: >
            pnpm test:unit:coverage
            --coverage.reporter=text-summary
            --coverage.reporter=json-summary
            --coverage.reporter=html
            --coverage.thresholds.lines=90
      - store_artifacts:
          path: coverage
          destination: coverage

  # ============================================
  # BUILD
  # ============================================
  build:
    executor: node
    environment:
      NODE_ENV: production
      APP_URL: https://dev.diaspomoney.fr
      API_URL: https://dev.diaspomoney.fr/api
      NEXTAUTH_URL: https://dev.diaspomoney.fr
      NEXT_PUBLIC_APP_URL: https://dev.diaspomoney.fr
      NEXT_PUBLIC_API_URL: https://dev.diaspomoney.fr/api
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
    steps:
      - attach-deps
      - run:
          name: 🏗️ Build application
          command: pnpm build

# ============================================
# WORKFLOWS
# ============================================
workflows:
  # Même chaîne pour toutes les branches (dev, rct, main et pull requests).
  ci:
    jobs:
      - install-dependencies
      - tests:
          requires:
            - install-dependencies
      - coverage:
          requires:
            - tests
      - build:
          requires:
            - tests
