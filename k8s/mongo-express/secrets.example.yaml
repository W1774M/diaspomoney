# EXAMPLE ONLY — do not commit real credentials.
#
# Option A — Traefik basicAuth (recommended for IngressRoute):
#   htpasswd -nbB admin 'STRONG_PASSWORD' | kubectl create secret generic mongo-express-traefik-auth \
#     --from-file=users=/dev/stdin -n diaspomoney
#
# Option B — apply this file after replacing placeholders (users = htpasswd line, base64 optional via stringData):
apiVersion: v1
kind: Secret
metadata:
  name: mongo-express-traefik-auth
  namespace: diaspomoney
type: Opaque
stringData:
  # Format: user:hashedPassword (htpasswd -nbB …)
  users: |
    admin:$2y$05$REPLACE_WITH_HTPASSWD_HASH
