apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: diaspomoney

resources:
  - ../../base
  - ingress.yaml

patches:
  - path: deployment-patch.yaml
  - path: service-patch.yaml
  - target:
      kind: Deployment
      name: diaspomoney
    patch: |-
      - op: replace
        path: /metadata/name
        value: diaspomoney-prod
      - op: replace
        path: /spec/template/spec/containers/0/name
        value: diaspomoney-prod
  - target:
      kind: Service
      name: diaspomoney-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: diaspomoney-prod-service

images:
  - name: localhost:5000/diaspomoney
    newName: localhost:5000/diaspomoney
    newTag: prod-latest
