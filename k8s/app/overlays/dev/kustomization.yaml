apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: diaspomoney

resources:
  - ../../base
  - ingress.yaml

patches:
  - path: deployment-patch.yaml
  - path: service-patch.yaml
  # Rename base resources to env-specific names (preserve existing kubectl/ops names)
  - target:
      kind: Deployment
      name: diaspomoney
    patch: |-
      - op: replace
        path: /metadata/name
        value: diaspomoney-dev
      - op: replace
        path: /spec/template/spec/containers/0/name
        value: diaspomoney-dev
  - target:
      kind: Service
      name: diaspomoney-service
    patch: |-
      - op: replace
        path: /metadata/name
        value: diaspomoney-dev-service

images:
  - name: localhost:5000/diaspomoney
    newTag: dev
