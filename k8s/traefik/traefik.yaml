apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  namespace: kube-system
data:
  traefik.yaml: |
    entryPoints:
      web:
        address: ":80"

      websecure:
        address: ":443"

      mongo:
        address: ":27017"

    certificatesResolvers:
      le:
        acme:
          email: "contact@diaspomoney.fr"
          storage: "/data/acme.json"
          httpChallenge:
            entryPoint: web
          tlsChallenge: true
