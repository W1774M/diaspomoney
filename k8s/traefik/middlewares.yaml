apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: diaspomoney
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: diaspomoney
spec:
  headers:
    # Bonnes pratiques de base (ajuste selon ton besoin)
    contentTypeNosniff: true
    browserXssFilter: true
    frameDeny: true
    referrerPolicy: "no-referrer"
    # HSTS (attention: à activer seulement si tu es sûr de servir en HTTPS partout)
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true


