apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: diaspomoney
spec:
  redirectScheme:
    scheme: https
    permanent: true

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: diaspomoney
spec:
  headers:
    # Bonnes pratiques de base (ajuste selon ton besoin)
    contentTypeNosniff: true
    browserXssFilter: true
    frameDeny: true
    referrerPolicy: "no-referrer"
    # HSTS (attention: à activer seulement si tu es sûr de servir en HTTPS partout)
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-basic-auth
  namespace: diaspomoney
spec:
  basicAuth:
    # IMPORTANT:
    # - Crée le secret "internal-basic-auth" (clé: users) dans le namespace diaspomoney
    # - Format attendu: htpasswd (une ou plusieurs lignes)
    secret: internal-basic-auth
    # Améliore la compatibilité (retire l'en-tête Authorization vers l'app)
    removeHeader: true


