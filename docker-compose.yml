version: '3.8'

services:
  # === BUILD FOR RECETTE ===
  app-recette:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENV: rct
        NODE_ENV: production
        NEXT_PUBLIC_APP_URL: https://rct.diaspomoney.fr
        NEXT_PUBLIC_API_URL: https://rct.diaspomoney.fr/api
        USE_LOCAL_BUILD: "false"
    image: localhost:5000/diaspomoney:rct-${BUILD_DATE:-latest}
    container_name: diaspomoney-app-rct-build
    profiles: ["build-only"]

  # === BUILD FOR PROD ===
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENV: prod
        NODE_ENV: production
        NEXT_PUBLIC_APP_URL: https://diaspomoney.fr
        NEXT_PUBLIC_API_URL: https://diaspomoney.fr/api
        USE_LOCAL_BUILD: "false"
    image: localhost:5000/diaspomoney:prod-${BUILD_DATE:-latest}
    container_name: diaspomoney-app-prod-build
    profiles: ["build-only"]

  # === BUILD FOR DEV ===
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENV: dev
        NODE_ENV: development
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_API_URL: http://localhost:3000/api
        USE_LOCAL_BUILD: "true"  # Use local build for dev
    image: localhost:5000/diaspomoney:dev-${BUILD_DATE:-latest}
    container_name: diaspomoney-app-dev-build
    profiles: ["build-only"]
