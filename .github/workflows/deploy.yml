name: 🚀 Déploiement Multi-Environnements

on:
  push:
    branches:
      - main      # Production
      - rct       # Recette
      - dev       # Développement
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement à déployer'
        required: true
        type: choice
        options:
          - dev
          - rct
          - prod

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.18.3'
  COVERAGE_THRESHOLD: 95

jobs:
  # ============================================
  # ÉTAPE 1: TESTS
  # ============================================
  tests:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.total }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Lint
        run: pnpm lint

      - name: 📝 TypeScript Check
        run: pnpm tsc:check

      - name: 🧪 Unit Tests (Client)
        run: pnpm test:unit:client

      - name: 🧪 Unit Tests (Server)
        run: pnpm test:unit:server

      - name: 🐳 Start MongoDB for Integration Tests
        run: pnpm test:db:up

      - name: ⏳ Wait for MongoDB
        run: |
          timeout=60
          elapsed=0
          while ! docker exec diaspomoney-mongodb-test mongosh --quiet --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "❌ MongoDB n'a pas démarré dans les $timeout secondes"
              exit 1
            fi
            echo "⏳ Attente de MongoDB... ($elapsed/$timeout secondes)"
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "✅ MongoDB est prêt!"

      - name: 🔗 Integration Tests
        run: pnpm test:integration
        env:
          MONGODB_URI: mongodb://127.0.0.1:27018/diaspomoney_test
          NODE_ENV: test

      - name: 🧹 Stop MongoDB
        if: always()
        run: pnpm test:db:down

      - name: 🎭 E2E Tests
        run: |
          pnpm exec playwright install --with-deps
          pnpm build
          pnpm test:e2e
        env:
          NODE_ENV: production

      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: ❌ Notifier échec des tests
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Tests échoués sur ${context.ref}`,
              body: `Les tests ont échoué sur la branche ${context.ref}.\n\nCommit: ${context.sha}\nAuteur: ${context.actor}\n\nVoir les détails: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'ci-failure']
            });

  # ============================================
  # ÉTAPE 2: COUVERTURE DE CODE
  # ============================================
  coverage:
    name: 📈 Couverture de Code
    runs-on: ubuntu-latest
    needs: tests
    outputs:
      coverage-percent: ${{ steps.coverage-check.outputs.percent }}
      passed: ${{ steps.coverage-check.outputs.passed }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🐳 Start MongoDB
        run: pnpm test:db:up

      - name: ⏳ Wait for MongoDB
        run: |
          timeout=60
          elapsed=0
          while ! docker exec diaspomoney-mongodb-test mongosh --quiet --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "❌ MongoDB n'a pas démarré"
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done

      - name: 📊 Générer couverture
        run: |
          pnpm test:unit:coverage
          pnpm test:integration --coverage
        env:
          MONGODB_URI: mongodb://127.0.0.1:27018/diaspomoney_test
          NODE_ENV: test

      - name: 🧹 Stop MongoDB
        if: always()
        run: pnpm test:db:down

      - name: 📈 Vérifier seuil de couverture
        id: coverage-check
        run: |
          COVERAGE_FILE="./coverage/coverage-summary.json"
          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "❌ Fichier de couverture non trouvé"
            exit 1
          fi
          
          # Extraire le pourcentage total de couverture avec Node.js
          TOTAL_COVERAGE=$(node -e "
            const fs = require('fs');
            const cov = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
            const pct = cov.total.lines.pct;
            console.log(pct.toFixed(2));
          ")
          
          echo "📊 Couverture actuelle: ${TOTAL_COVERAGE}%"
          echo "🎯 Seuil minimum requis: ${{ env.COVERAGE_THRESHOLD }}%"
          
          # Comparer avec le seuil (utiliser awk pour la comparaison décimale)
          THRESHOLD=${{ env.COVERAGE_THRESHOLD }}
          PASSED=$(node -e "console.log(${TOTAL_COVERAGE} >= ${THRESHOLD} ? 'true' : 'false')")
          
          if [ "$PASSED" = "false" ]; then
            echo "❌ La couverture (${TOTAL_COVERAGE}%) est inférieure au seuil requis (${{ env.COVERAGE_THRESHOLD }}%)"
            echo "percent=${TOTAL_COVERAGE}" >> $GITHUB_OUTPUT
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ Couverture suffisante: ${TOTAL_COVERAGE}% >= ${{ env.COVERAGE_THRESHOLD }}%"
            echo "percent=${TOTAL_COVERAGE}" >> $GITHUB_OUTPUT
            echo "passed=true" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Upload Coverage Reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: 📤 Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: ❌ Notifier échec de couverture
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage-check.outputs.percent }}';
            const threshold = '${{ env.COVERAGE_THRESHOLD }}';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Couverture insuffisante: ${coverage}% < ${threshold}%`,
              body: `La couverture de code (${coverage}%) est inférieure au seuil minimum requis (${threshold}%).\n\nCommit: ${context.sha}\nAuteur: ${context.actor}\n\nVoir les détails: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'ci-failure', 'coverage']
            });

  # ============================================
  # ÉTAPE 3: BUILD
  # ============================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [tests, coverage]
    if: needs.coverage.outputs.passed == 'true'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build application
        run: pnpm build
        env:
          NODE_ENV: production

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: .next/
          retention-days: 7

  # ============================================
  # ÉTAPE 4: DÉPLOIEMENT DEV
  # ============================================
  deploy-dev:
    name: 🚀 Déploiement Dev
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.ref == 'refs/heads/dev' || 
       (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')) &&
      needs.coverage.outputs.passed == 'true'
    
    environment:
      name: development
      url: https://dev.diaspomoney.fr
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: 🔐 Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl cluster-info

      - name: 🚀 Déployer sur Dev
        run: |
          export KUBECONFIG=kubeconfig
          chmod +x ./scripts/deploy.sh
          ./scripts/deploy.sh dev
        env:
          KUBECONFIG: kubeconfig

      - name: ✅ Vérifier le déploiement
        run: |
          export KUBECONFIG=kubeconfig
          kubectl rollout status deployment/diaspomoney-app -n diaspomoney --timeout=300s || true
          kubectl get pods -n diaspomoney -l app=diaspomoney-app

      - name: 🧪 Smoke Tests
        run: |
          sleep 10
          curl -f https://dev.diaspomoney.fr/api/health || echo "⚠️ Smoke test échoué"

  # ============================================
  # ÉTAPE 5: DÉPLOIEMENT RCT
  # ============================================
  deploy-rct:
    name: 🚀 Déploiement Recette
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.ref == 'refs/heads/rct' || 
       (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'rct')) &&
      needs.coverage.outputs.passed == 'true'
    
    environment:
      name: recette
      url: https://rct.diaspomoney.fr
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: 🔐 Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_RCT }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl cluster-info

      - name: 🚀 Déployer sur Recette
        run: |
          export KUBECONFIG=kubeconfig
          chmod +x ./scripts/deploy.sh
          ./scripts/deploy.sh rct
        env:
          KUBECONFIG: kubeconfig

      - name: ✅ Vérifier le déploiement
        run: |
          export KUBECONFIG=kubeconfig
          kubectl rollout status deployment/diaspomoney-app -n diaspomoney --timeout=300s || true
          kubectl get pods -n diaspomoney -l app=diaspomoney-app

      - name: 🧪 Smoke Tests
        run: |
          sleep 10
          curl -f https://rct.diaspomoney.fr/api/health || echo "⚠️ Smoke test échoué"

  # ============================================
  # ÉTAPE 6: DÉPLOIEMENT PROD (avec approbation)
  # ============================================
  deploy-prod:
    name: 🚀 Déploiement Production
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.ref == 'refs/heads/main' || 
       (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')) &&
      needs.coverage.outputs.passed == 'true'
    
    environment:
      name: production
      url: https://diaspomoney.fr
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: 🔐 Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl cluster-info

      - name: 📋 Afficher informations de déploiement
        run: |
          echo "🚀 Déploiement en production"
          echo "📦 Commit: ${{ github.sha }}"
          echo "👤 Auteur: ${{ github.actor }}"
          echo "🌿 Branche: ${{ github.ref_name }}"
          echo "📅 Date: $(date)"

      - name: 🚀 Déployer sur Production
        run: |
          export KUBECONFIG=kubeconfig
          chmod +x ./scripts/deploy.sh
          ./scripts/deploy.sh prod
        env:
          KUBECONFIG: kubeconfig

      - name: ✅ Vérifier le déploiement
        run: |
          export KUBECONFIG=kubeconfig
          kubectl rollout status deployment/diaspomoney-app -n diaspomoney --timeout=600s || true
          kubectl get pods -n diaspomoney -l app=diaspomoney-app

      - name: 🧪 Smoke Tests
        run: |
          sleep 15
          curl -f https://diaspomoney.fr/api/health || echo "⚠️ Smoke test échoué"

      - name: 📢 Notifier déploiement réussi
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'deployment-success',
              client_payload: {
                environment: 'production',
                commit: context.sha,
                actor: context.actor,
                branch: context.ref_name
              }
            });

  # ============================================
  # ROLLBACK AUTOMATIQUE (en cas d'échec)
  # ============================================
  rollback:
    name: 🔄 Rollback
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-rct, deploy-prod]
    if: failure()
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: 🔄 Déterminer l'environnement
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "kubeconfig_secret=KUBE_CONFIG_PROD" >> $GITHUB_OUTPUT
            echo "namespace=diaspomoney" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/rct" ]]; then
            echo "environment=rct" >> $GITHUB_OUTPUT
            echo "kubeconfig_secret=KUBE_CONFIG_RCT" >> $GITHUB_OUTPUT
            echo "namespace=diaspomoney" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "kubeconfig_secret=KUBE_CONFIG_DEV" >> $GITHUB_OUTPUT
            echo "namespace=diaspomoney" >> $GITHUB_OUTPUT
          fi

      - name: 🔐 Configure kubectl
        run: |
          if [[ "${{ steps.env.outputs.environment }}" == "prod" ]]; then
            echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig
          elif [[ "${{ steps.env.outputs.environment }}" == "rct" ]]; then
            echo "${{ secrets.KUBE_CONFIG_RCT }}" | base64 -d > kubeconfig
          else
            echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > kubeconfig
          fi
          export KUBECONFIG=kubeconfig

      - name: 🔄 Rollback deployment
        run: |
          export KUBECONFIG=kubeconfig
          kubectl rollout undo deployment/diaspomoney-app -n ${{ steps.env.outputs.namespace }} || true
          kubectl rollout status deployment/diaspomoney-app -n ${{ steps.env.outputs.namespace }} --timeout=300s || true

      - name: 📢 Notifier rollback
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔄 Rollback automatique sur ${{ steps.env.outputs.environment }}`,
              body: `Un rollback automatique a été effectué suite à un échec de déploiement.\n\nEnvironnement: ${{ steps.env.outputs.environment }}\nCommit: ${context.sha}\nAuteur: ${context.actor}\n\nVoir les détails: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['deployment', 'rollback', 'urgent']
            });

  # ============================================
  # RÉSUMÉ FINAL
  # ============================================
  summary:
    name: 📋 Résumé du Déploiement
    runs-on: ubuntu-latest
    needs: [tests, coverage, build, deploy-dev, deploy-rct, deploy-prod]
    if: always()
    
    steps:
      - name: 📋 Générer résumé
        uses: actions/github-script@v7
        with:
          script: |
            const env = '${{ github.ref_name }}' === 'main' ? 'prod' : 
                       '${{ github.ref_name }}' === 'rct' ? 'rct' : 'dev';
            
            const testsStatus = '${{ needs.tests.result }}';
            const coverageStatus = '${{ needs.coverage.result }}';
            const buildStatus = '${{ needs.build.result }}';
            const deployStatus = env === 'prod' ? '${{ needs.deploy-prod.result }}' :
                               env === 'rct' ? '${{ needs.deploy-rct.result }}' :
                               '${{ needs.deploy-dev.result }}';
            
            const coverage = '${{ needs.coverage.outputs.coverage-percent }}';
            
            const emoji = {
              success: '✅',
              failure: '❌',
              cancelled: '⚠️',
              skipped: '⏭️'
            };
            
            const status = {
              success: 'SUCCÈS',
              failure: 'ÉCHEC',
              cancelled: 'ANNULÉ',
              skipped: 'IGNORÉ'
            };
            
            const getEmoji = (s) => emoji[s] || '❓';
            const getStatus = (s) => status[s] || 'INCONNU';
            
            let appUrl = 'https://dev.diaspomoney.fr';
            if (env === 'prod') {
              appUrl = 'https://diaspomoney.fr';
            } else if (env === 'rct') {
              appUrl = 'https://rct.diaspomoney.fr';
            }
            
            let finalMessage = '## ⚠️ Déploiement non terminé';
            if (deployStatus === 'success') {
              finalMessage = '## ✅ Déploiement réussi !';
            } else if (deployStatus === 'failure') {
              finalMessage = '## ❌ Déploiement échoué - Rollback effectué';
            }
            
            const summary = [
              '# 📋 Résumé du Déploiement',
              '',
              '## 🌿 Environnement: ' + env.toUpperCase(),
              '## 📦 Commit: ' + context.sha.substring(0, 7),
              '## 👤 Auteur: ' + context.actor,
              '## 📅 Date: ' + new Date().toLocaleString('fr-FR'),
              '',
              '---',
              '',
              '## 📊 Statut des Étapes',
              '',
              '| Étape | Statut | Détails |',
              '|-------|--------|---------|',
              '| 🧪 Tests | ' + getEmoji(testsStatus) + ' ' + getStatus(testsStatus) + ' | Tous les tests doivent passer |',
              '| 📈 Couverture | ' + getEmoji(coverageStatus) + ' ' + getStatus(coverageStatus) + ' | ' + (coverage || 'N/A') + '% (minimum: 95%) |',
              '| 🏗️ Build | ' + getEmoji(buildStatus) + ' ' + getStatus(buildStatus) + ' | Compilation de l\'application |',
              '| 🚀 Déploiement | ' + getEmoji(deployStatus) + ' ' + getStatus(deployStatus) + ' | Déploiement sur ' + env + ' |',
              '',
              '---',
              '',
              '## 🔗 Liens Utiles',
              '',
              '- [📊 Détails du workflow](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ')',
              '- [📝 Commit](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/commit/' + context.sha + ')',
              '- [🌐 Application](' + appUrl + ')',
              '',
              '---',
              '',
              finalMessage
            ].join('\n');
            
            core.summary.addRaw(summary);
            await core.summary.write();

